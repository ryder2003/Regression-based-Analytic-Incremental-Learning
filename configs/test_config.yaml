seed: 42
backbone: 'ViT-B/16'
datasets: ["dtd", "oxford_flowers", "oxford_pets"]
num_shots: 16

batch_size: 64
batch_size_eval: 256
regularization: 0.1
fusion_weight: 0.8

feature_expansion: 1
hidden_dim: 15000

gamma: 0.1

augmentation_time: 1

eval_adapter: 1  # evaluate on only learned domains
eval_last: 0  # evaluate only last accuracy
